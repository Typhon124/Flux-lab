<style>

#stage{position:relative;flex:1;min-width:0;background:radial-gradient(ellipse at 50% 40%,#13203a 0%,#0a1020 55%,#05070d 100%);overflow:hidden}

@media(max-width:820px){main{flex-direction:column}#stage{flex:none;height:54vh;height:54svh}aside{width:auto;flex:1;border-left:0;border-top:1px solid var(--ln)}#hud{min-width:0;padding:7px 10px;font-size:11.5px}#hud .big{font-size:17px}.brand span{display:none}nav{order:3;flex-basis:100%}#tip{font-size:11px}}
h2{margin:0 0 4px;font-size:18px}

.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}

.s output{font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{grid-column:1/3;width:100%;margin:6px 0 0;accent-color:var(--ac);height:22px}
.ch h3{margin:2px 0 6px;font-size:14px;display:flex;justify-content:space-between}
.ci{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:10px;transition:background .3s}
.ci+.ci{border-top:1px solid var(--ln)}
.ci .st{font-size:20px;line-height:1;color:#3d4a60;transition:color .3s,transform .3s}
.ci.done .st{color:var(--gold);transform:scale(1.15)}
.ci.done b{color:var(--gold)}

.tg{display:inline-flex;gap:5px;align-items:center;font-size:13px;margin-right:10px;white-space:nowrap}
.tg input{accent-color:var(--ac)}
details{margin-top:10px;color:#b7c4d9;font-size:13px}
details summary{cursor:pointer;color:var(--tx);font-weight:700}
details p{margin:6px 0}
.vec{font-style:italic;font-weight:700}
.k{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:#c3cfe2}

.meter i{position:absolute;inset:0 auto 0 0;border-radius:7px;transition:width .3s,background .3s}

.slot.got{border:1px solid var(--sf);color:var(--sf);background:rgba(61,220,151,.08);font-weight:700}
canvas#pl{width:100%;max-width:340px;display:block;margin-top:8px;background:#0a0f1a;border-radius:10px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.pos{color:var(--pos)}.negc{color:var(--neg)}

.chg.p{border-color:#6b2a33;color:#ff8a96}.chg.n{border-color:#24406e;color:#8fb6ff}
</style></head>
<body>
<header>
 <div class="brand"><i>⚡</i>Flux Lab<span style="color:var(--mu);font-weight:500;font-size:13px">&nbsp;· Electric flux &amp; Gauss’s law</span></div>
 <nav id="tabs"><button data-m="0">1 · Flux Catcher</button><button data-m="1">2 · Gauss Arena</button><button data-m="2">3 · Symmetry Studio</button></nav>
 <div class="right"><span id="stars">★ 0/14</span><button id="snd" title="Sound on/off" aria-label="Toggle sound">🔊</button></div>
</header>
<main>
 <div id="stage"><canvas id="c" aria-label="Interactive 3D view"></canvas><div id="hud"></div><div id="toast"></div><div id="tip"></div><button id="rv">⟲ View</button></div>
 <aside id="pn"></aside>
</main>
<canvas id="fx"></canvas>
<script>
"use strict";
/* ================= helpers ================= */
const $=i=>document.getElementById(i),PI=Math.PI,K=8.9875517923e9,E0=8.8541878128e-12;
const add3=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],scl=(a,s)=>[a[0]*s,a[1]*s,a[2]*s],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],len=a=>Math.hypot(a[0],a[1],a[2]),norm=a=>{const l=len(a)||1;return[a[0]/l,a[1]/l,a[2]/l]};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fib=(N,i)=>{const y=1-2*(i+.5)/N,r=Math.sqrt(Math.max(0,1-y*y)),p=i*2.399963;return[r*Math.cos(p),y,r*Math.sin(p)]};
const dirTP=(t,p)=>[Math.sin(t)*Math.cos(p),Math.cos(t),Math.sin(t)*Math.sin(p)];
const sci=x=>{if(Math.abs(x)<1e-300)return'0';const[m,e]=x.toExponential(2).split('e');return m+' × 10<sup>'+(+e)+'</sup>'};
const f=(x,d=1)=>(Math.abs(x)<.5*Math.pow(10,-d)?0:x).toFixed(d);
const sl=(id,t,a,b,s,v,u)=>`<label class="s"><span>${t}</span><output id="o_${id}">${v} ${u}</output><input type="range" id="${id}" min="${a}" max="${b}" step="${s}" value="${v}" data-u="${u}"></label>`;
const setS=(id,x)=>{const e=$(id);if(!e)return;e.value=x;$('o_'+id).textContent=e.value+' '+e.dataset.u};
const hex2=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};

/* ================= storage, sound, toast, confetti ================= */
let done=new Set();try{done=new Set(JSON.parse(localStorage.getItem('fluxlab-stars')||'[]'))}catch(e){}
const saveDone=()=>{try{localStorage.setItem('fluxlab-stars',JSON.stringify([...done]))}catch(e){}};
let AC=null,sndOn=true;
try{sndOn=localStorage.getItem('fluxlab-snd')!=='0'}catch(e){}
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(fq,d=.08,type='sine',v=.04,delay=0){if(!sndOn)return;const a=au();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(fq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(1e-4,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
const chime=()=>[523,659,784,1047,1319].forEach((q,i)=>tone(q,.3,'triangle',.06,i*.07));
const pop=()=>{tone(300,.12,'square',.03);tone(150,.18,'sine',.05,.03)};
$('snd').onclick=()=>{sndOn=!sndOn;$('snd').textContent=sndOn?'🔊':'🔇';try{localStorage.setItem('fluxlab-snd',sndOn?'1':'0')}catch(e){}if(sndOn)tone(660,.1,'triangle',.05)};
$('snd').textContent=sndOn?'🔊':'🔇';
let toastT=0;function toast(t){const e=$('toast');e.innerHTML=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2600)}
const fx=$('fx'),fxc=fx.getContext('2d');let conf=[];
function confetti(n=140){const r=$('stage').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.35,cols=['#ffd54f','#ff5a6a','#4fd1ff','#3ddc97','#b388ff','#ff9f43'];
 for(let i=0;i<n;i++){const a=Math.random()*2*PI,s=4+Math.random()*9;conf.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:Math.random()*PI,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],w:5+Math.random()*6,l:1})}}
function fxFrame(){if(!conf.length&&!fx._on)return;const W=innerWidth,H=innerHeight;if(fx.width!==W||fx.height!==H){fx.width=W;fx.height=H}fxc.clearRect(0,0,W,H);fx._on=conf.length>0;
 conf=conf.filter(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.009;fxc.save();fxc.globalAlpha=Math.max(0,p.l);fxc.translate(p.x,p.y);fxc.rotate(p.r);fxc.fillStyle=p.c;fxc.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);fxc.restore();return p.l>0&&p.y<H+20})}

/* ================= 3D engine on a 2D canvas ================= */
const cv=$('c'),ctx=cv.getContext('2d');let W=300,H=300,DPR=1;
function resize(){const r=$('stage').getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
new ResizeObserver(resize).observe($('stage'));resize();
const cam={az:.85,el:.38,dist:13,fov:45};let eye,fw,rt,upv,foc;
function camUpdate(){const{az,el,dist}=cam;eye=[dist*Math.cos(el)*Math.cos(az),dist*Math.sin(el),dist*Math.cos(el)*Math.sin(az)];fw=norm(scl(eye,-1));rt=norm(cross(fw,[0,1,0]));upv=cross(rt,fw);foc=Math.min(H,W*1.25)/2/Math.tan(cam.fov*PI/360)}
function P(p){const d=sub3(p,eye),z=dot(d,fw);if(z<.3)return null;const s=foc/z;return[W/2+dot(d,rt)*s,H/2-dot(d,upv)*s,z,s]}
function hitY(sx,sy,y0=0){const d=norm(add3(fw,add3(scl(rt,(sx-W/2)/foc),scl(upv,-(sy-H/2)/foc))));if(Math.abs(d[1])<1e-4)return null;const t=(y0-eye[1])/d[1];return t>0?add3(eye,scl(d,t)):null}
const glowC={};
function sprite(col){if(glowC[col])return glowC[col];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.15,col);gr.addColorStop(.45,hex2(col,.35));gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return glowC[col]=c}
function glow(sp,r,col,a=1){if(!sp)return;ctx.globalAlpha=clamp(a,0,1);ctx.drawImage(sprite(col),sp[0]-r,sp[1]-r,2*r,2*r);ctx.globalAlpha=1}
function line3(a,b,col,w=1,al=1){const p=P(a),q=P(b);if(!p||!q)return;ctx.globalAlpha=al;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();ctx.globalAlpha=1}
function poly3(pts,fill,stroke,w=1,dash){const q=pts.map(P);if(q.some(x=>!x))return;ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.setLineDash(dash||[]);ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.stroke();ctx.setLineDash([])}}
function arrow(o,d,L,col,w=2.5,al=1){const p0=P(o),p1=P(add3(o,scl(d,L)));if(!p0||!p1)return null;const dx=p1[0]-p0[0],dy=p1[1]-p0[1],l=Math.hypot(dx,dy);if(l<2)return p1;
 const ux=dx/l,uy=dy/l,hs=Math.min(l*.5,clamp(p1[3]*.22,6,15));ctx.globalAlpha=al;ctx.strokeStyle=ctx.fillStyle=col;ctx.lineWidth=w;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p1[0]-ux*hs*.7,p1[1]-uy*hs*.7);ctx.stroke();
 ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p1[0]-ux*hs-uy*hs*.45,p1[1]-uy*hs+ux*hs*.45);ctx.lineTo(p1[0]-ux*hs+uy*hs*.45,p1[1]-uy*hs-ux*hs*.45);ctx.closePath();ctx.fill();ctx.globalAlpha=1;return p1}
function label(p,t,col,size=13,al=1){const q=P(p);if(!q)return;ctx.globalAlpha=al;ctx.font=`700 ${size}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='rgba(5,8,15,.85)';ctx.strokeText(t,q[0],q[1]);ctx.fillStyle=col;ctx.fillText(t,q[0],q[1]);ctx.globalAlpha=1}
function floor(y=-2.9,ext=7){ctx.lineWidth=1;for(let i=-ext;i<=ext;i++){const al=.05+.05*(1-Math.abs(i)/ext);line3([i,y,-ext],[i,y,ext],'#6f8bb8',1,al);line3([-ext,y,i],[ext,y,i],'#6f8bb8',1,al)}}
const lighter=on=>ctx.globalCompositeOperation=on?'lighter':'source-over';

/* ================= challenges ================= */
const CH=[[],[],[]];let cur=0;
function chHTML(m){const n=CH[m].filter(c=>done.has(c.id)).length;return`<div class="card ch"><h3><span>🎯 Challenges</span><span style="color:var(--gold)">${n}/${CH[m].length} ★</span></h3>${CH[m].map(c=>`<div class="ci ${done.has(c.id)?'done':''}" id="ci_${c.id}"><span class="st">${done.has(c.id)?'★':'☆'}</span><div><b>${c.t}</b><small>${c.d}</small></div></div>`).join('')}</div>`}
function updStars(){const tot=CH.reduce((s,a)=>s+a.length,0),n=CH.flat().filter(c=>done.has(c.id)).length;$('stars').textContent=`★ ${n}/${tot}`}
function checkCh(){for(const c of CH[cur]){if(done.has(c.id))continue;let ok=false;try{ok=c.ok()}catch(e){}if(ok){done.add(c.id);saveDone();toast('★ '+c.t+'!');confetti();chime();const el=$('ci_'+c.id);if(el){el.classList.add('done','flash');el.querySelector('.st').textContent='★';setTimeout(()=>el.classList.remove('flash'),1500);const h=el.parentElement.querySelector('h3 span:last-child');if(h)h.textContent=`${CH[cur].filter(x=>done.has(x.id)).length}/${CH[cur].length} ★`}updStars()}}}

/* =====================================================================
   MODE 1 — FLUX CATCHER
   ===================================================================== */
const M1={E:200,A:4,th:35,parts:[],bursts:[],rate:0,spin:false,dragged:false,lastTick:0,drag:false};
CH[0]=[
 {id:'m1max',t:'Full catch',d:'Get the biggest possible positive flux for your sheet.',ok:()=>Math.cos(M1.th*PI/180)>.9995},
 {id:'m1zero',t:'Ghost sheet',d:'Make the flux zero while the sheet sits right in the field.',ok:()=>Math.abs(Math.cos(M1.th*PI/180))<.009},
 {id:'m1half',t:'Half power',d:'Catch exactly half of the maximum flux for your sheet.',ok:()=>Math.abs(Math.cos(M1.th*PI/180)-.5)<.009},
 {id:'m1neg',t:'Backwards',d:'Make the flux negative: sparks go through against the normal.',ok:()=>Math.cos(M1.th*PI/180)<-.25},
 {id:'m1tgt',t:'Bullseye',d:'Hit Φ = 450 N·m²/C (±2%). You’ll need more than one slider.',ok:()=>Math.abs(m1Phi()-450)<=9}];
const m1Phi=()=>M1.E*M1.A*Math.cos(M1.th*PI/180);
const m1Panel=()=>`<h2>Flux Catcher</h2><p class="intro">The blue sparks are a uniform <b>electric field</b>. Your green sheet is a surface. <b>Flux is how much field flies through it.</b> Drag the <span style="color:var(--A)">pink handle</span> to tilt the sheet.</p>
<div class="card"><div class="eq" id="m1eq"></div><div class="legend" style="margin-top:8px"><span><i class="k" style="background:var(--E)"></i>field <span class="vec">E</span></span><span><i class="k" style="background:var(--sf)"></i>sheet, area A</span><span><i class="k" style="background:var(--A)"></i>normal <span class="vec">n̂</span></span><span><i class="k" style="background:var(--gold)"></i>shadow = A cos θ</span></div></div>
${sl('E','Field strength E: more sparks',50,500,10,M1.E,'N/C')}${sl('A','Sheet area A',1,9,.5,M1.A,'m²')}${sl('th','Tilt θ: angle from E to the normal',0,180,1,Math.abs(M1.th),'°')}
<div class="row"><span class="t">Try:</span><button onclick="m1Set(0)">θ = 0°</button><button onclick="m1Set(60)">60°</button><button onclick="m1Set(90)">90°</button><button onclick="m1Set(180)">180°</button><button id="m1spin" onclick="M1.spin=!M1.spin;this.classList.toggle('on',M1.spin)">⟳ Spin</button></div>
<div class="row"><span class="t">Lecture (E = 100 N/C, A = 4 m²):</span><button onclick="m1Lec(0)">Ex. 1 · 0°</button><button onclick="m1Lec(90)">Ex. 2 · 90°</button><button onclick="m1Lec(70)">Ex. 3 · 70°</button></div>
${chHTML(0)}
<details><summary>Key ideas</summary>
<p><b>Flux counts what gets through.</b> Every spark moves at the same speed, so the rate at which the sheet catches sparks is proportional to Φ<sub>E</sub> = EA cos θ.</p>
<p><b>θ is measured from the normal.</b> At θ = 0° the sheet faces the field head-on. At θ = 90° it is edge-on and nothing gets through. The angle to the sheet itself is |90° − θ|.</p>
<p><b>The shadow.</b> The gold outline is the sheet’s shadow seen along the field. Its area is A cos θ: the area the field actually “sees”.</p>
<p><b>Sign.</b> Sparks crossing along <span class="vec">n̂</span> count as positive (orange). Sparks crossing against it count as negative (purple). For a closed surface <span class="vec">n̂</span> points outward.</p>
<p><b>Lecture note.</b> Example 3 prints 181.6. In fact 100 × 4 × cos 70° = 136.8 N·m²/C, which is what the lab shows.</p></details>`;
